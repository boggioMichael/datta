name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=optional --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run validate
        env:
          # Repository variables override these; the defaults publish to <user>.github.io/<repo>.
          SITE_URL: ${{ vars.SITE_URL || 'https://boggiomichael.github.io/datta' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/datta' }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CONTACT_FORM_ENDPOINT: ${{ vars.CONTACT_FORM_ENDPOINT }}
          ANALYTICS_PROVIDER: ${{ vars.ANALYTICS_PROVIDER }}
          ANALYTICS_DOMAIN: ${{ vars.ANALYTICS_DOMAIN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

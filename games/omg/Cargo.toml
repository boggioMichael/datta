[package]
name = "omg"
version = "1.0.0"
edition = "2024"
description = "OH MY GOD — a merge game from a Kia Picanto to the God of Israel. Physics, rules, progression and the whole sound engine in Rust, compiled to WebAssembly."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

summary:
  en: "A small Rust toolkit for reading a screen the way a person does — “there is a bar here and it is about 60% full” — without pretending to more certainty than the pixels support. The generic engine under MapleSyrup."
  he: "ערכת כלים קטנה ב-Rust לקריאת מסך כמו שאדם קורא אותו — ״יש כאן פס והוא מלא בערך ב-60%״ — בלי להעמיד פנים שיש יותר ודאות ממה שהפיקסלים מאפשרים. המנוע הגנרי שמתחת ל-MapleSyrup."

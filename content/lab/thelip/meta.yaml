title: { en: "TheLip", he: "TheLip" }
subtitle: { en: "Lip reading from video — as an experiment, with its ethics written first.", he: "קריאת שפתיים מווידאו — כניסוי, עם האתיקה כתובה קודם." }
summary:
  en: "An experimental computer-vision project exploring what can be recovered from mouth movement in ordinary video: who is speaking, in which language, and candidate text. Research stage; no capability claims."
  he: "פרויקט ניסיוני בראייה ממוחשבת שבוחן מה אפשר לשחזר מתנועת הפה בווידאו רגיל: מי מדבר, באיזו שפה, וטקסט מועמד. בשלב מחקר; בלי טענות על יכולות."

title: { en: "OH MY GOD", he: "OH MY GOD" }
subtitle: { en: "A merge game from crawling to the God of Israel — 124 tiers, written in Rust.", he: "משחק מיזוג מזחילה עד אלוהי ישראל — 124 דרגות, כתוב ב-Rust." }
summary:
  en: "Every run starts with a crawling baby. Two identical rides that touch merge into the next one up a 124-step ladder in 14 eras: walking, running, bikes, scooters and motorbikes, everyday cars, premium cars, supercars and hypercars, monster machines, trains, ships, planes, real spacecraft, science fiction, the rides of the gods from many mythologies, the holy finale with Elijah's chariot and the Messiah's donkey — and, last, God. Every merge screams “oh my god”, deeper and louder at each step. Physics, rules, scenery and the whole sound engine are Rust compiled to WebAssembly."
  he: "כל סיבוב מתחיל בתינוק שזוחל. שני כלי רכב זהים שנוגעים מתמזגים לשלב הבא בסולם של 124 דרגות ב-14 עידנים: הליכה, ריצה, אופניים, קורקינטים ואופנועים, מכוניות, פרימיום, סופרקארים והיפרקארים, מכונות־מפלצת, רכבות, ספינות, מטוסים, חלליות אמיתיות, מדע בדיוני, רכבי האלים מכל המיתולוגיות, וסיום קודש עם מרכבת האש של אליהו וחמורו של המשיח — ולבסוף אלוהים. כל מיזוג צועק ״oh my god״ — עמוק ורועש יותר בכל שלב. הפיזיקה, החוקים, הנופים ומנוע הסאונד כולו כתובים ב-Rust ומקומפלים ל-WebAssembly."

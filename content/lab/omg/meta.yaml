title: { en: "OH MY GOD", he: "OH MY GOD" }
subtitle: { en: "A merge game from a Kia Picanto to the God of Israel — written in Rust.", he: "משחק מיזוג מקיה פיקנטו עד אלוהי ישראל — כתוב ב-Rust." }
summary:
  en: "Two identical rides touching merge into the next one up a 37-step ladder: cars, planes, real spacecraft, science fiction, the vehicles of the gods, Elijah's chariot, the Messiah's donkey and, last, God. Every merge screams “oh my god” — deeper, bigger and louder at each step. Physics, rules and the whole sound engine are Rust compiled to WebAssembly."
  he: "שתי מכוניות זהות שנוגעות מתמזגות לשלב הבא בסולם של 37: מכוניות, מטוסים, חלליות אמיתיות, מדע בדיוני, הרכבים של האלים, מרכבת האש של אליהו, חמורו של המשיח ולבסוף — אלוהים. כל מיזוג צועק ״oh my god״ — עמוק, גדול ורועש יותר בכל שלב. הפיזיקה, החוקים ומנוע הסאונד כולו כתובים ב-Rust ומקומפלים ל-WebAssembly."
category: { en: "Game · Rust + WebAssembly", he: "משחק · Rust + WebAssembly" }

builtLevels:
  built:
    en:
      - "Engine in Rust with no dependencies: bouncy bubble-and-stem physics at 480 Hz with a sweep-and-prune broad phase, merge rules, chain reactions, random events, the 155-tier ladder, absolute sizes with a zooming world, eight modes, six tools, saves and stats"
      - "The journey, a game of skill: you aim every cell and choose when it falls, with the next two in the stem and a guide that shows where it will land; a strain line that bursts the bubble and sends you back to the start of the era; a law of nature for each of the 19 eras, from rush hour and crosswinds to tides, antimatter and the narrow way; six abilities that unlock along the way and that chain reactions charge; four difficulties; autosave and continue — tuned by a bot that plays the whole journey in the engine's tests"
      - "A living world for every era, painted in layers that fade into the haze and pull back with the camera, with drifting dust, lights, bubbles and stars, and the next tiers' giants out of focus in the deep — all built as draw commands in Rust"
      - "The bubble of life: a wobbling membrane you can poke, a fluid you can stir, living cells that breathe and splash when they fuse, a stem that feeds the cells in, and a burst of light when God is born"
      - "Evolution: every new era pulls the camera back onto a road of all 19 eras from the baby to God, every new tier is born in a double helix of light that follows it, and the end screen shows when you reached each era"
      - "An interactive Genesis 1:1–2:3 read by God in Hebrew (the Masoretic text) or English (JPS 1917): the story waits at eight moments of creation for a touch, a swipe or a long press, and every touch in between adds a tree, a star, a fish, a bird or a beast"
      - "Sound engine in Rust, running in a Web Worker: 155 OMGs and their effects, a loop for every era, a bounce melody, the held breath of creation — every sound rendered live from 33 short voice clips — and the whole Genesis soundtrack mixed by the same engine"
      - "168 illustrations drawn for the game, with no logos, and a reel recorder that captures the game as a 9:16 video with its sound"
    he:
      - "מנוע ב-Rust בלי תלויות: פיזיקה קופצנית של בועה וגבעול ב-480 צעדים לשנייה עם sweep-and-prune, חוקי מיזוג, תגובות שרשרת, אירועים אקראיים, סולם של 155 דרגות, גדלים אמיתיים ועולם שמתרחק, שמונה מצבים, שישה כלים, שמירה וסטטיסטיקה"
      - "המסע, משחק של מיומנות: מכוונים כל תא ובוחרים מתי הוא נופל, עם שני הבאים בגבעול וקו שמראה איפה הוא ינחת; קו לחץ שמפוצץ את הבועה ומחזיר לתחילת העידן; חוק טבע לכל אחד מ-19 העידנים, משעת עומס ורוח צד ועד גאות ושפל, אנטי־חומר והדרך הצרה; שש יכולות שנפתחות בדרך ותגובות שרשרת טוענות אותן; ארבע רמות קושי; שמירה אוטומטית והמשך — מכויל בעזרת בוט שמשחק את כל המסע בבדיקות של המנוע"
      - "עולם חי לכל עידן, מצויר בשכבות שנבלעות באובך ומתרחקות עם המצלמה, עם אבק, אורות, בועות וכוכבים שנסחפים, והענקים של הדרגות הבאות מחוץ לפוקוס במעמקים — כולם נבנים כפקודות ציור ב-Rust"
      - "בועת החיים: קרום שמתנודד ואפשר לדחוף, נוזל שאפשר לערבב באצבע, תאים חיים שנושמים ומתיזים כשהם מתמזגים, גבעול שמזין את התאים, ופיצוץ של אור כשאלוהים נוצר"
      - "אבולוציה: כל עידן חדש מושך את המצלמה אחורה אל מסלול של כל 19 העידנים מהתינוק ועד אלוהים, כל דרגה חדשה נולדת בסליל DNA של אור שהולך איתה, ומסך הסיום מראה מתי הגעת לכל עידן"
      - "בראשית א׳ א׳ עד ב׳ ג׳ אינטראקטיבי בקולו של אלוהים, בעברית (נוסח המסורה) או באנגלית (JPS 1917): הסיפור מחכה בשמונה רגעים של בריאה לנגיעה, להחלקה או ללחיצה ארוכה, וכל נגיעה בין לבין מוסיפה עץ, כוכב, דג, ציפור או חיה"
      - "מנוע סאונד ב-Rust שרץ ב-Web Worker: ‏155 צעקות OMG והאפקטים שלהן, לופ לכל עידן, מנגינת קפיצות ונשימה עצורה של הבריאה — כל צליל מרונדר בזמן אמת מ-33 קטעי קול קצרים — וכל פסקול בראשית עורבב באותו מנוע"
      - "‏168 איורים שצוירו במיוחד למשחק, בלי לוגואים, ומקליט רילז שמקליט את המשחק כסרטון 9:16 עם הסאונד"

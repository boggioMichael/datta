title: { en: "OH MY GOD", he: "OH MY GOD" }
subtitle: { en: "A merge game of skill from crawling to the God of Israel — 155 tiers in a bubble of life and a journey of hours, written in Rust.", he: "משחק מיזוג של מיומנות מזחילה עד אלוהי ישראל — 155 דרגות בבועת חיים ומסע של שעות, כתוב ב-Rust." }
summary:
  en: "Every journey starts with a crawling baby in a see-through bubble of life. You aim every cell, and two identical cells that touch fuse into the next tier, up a 155-step ladder in 19 eras — riding animals, motorbikes, cars, supercars, heavy machines, trains, sailing ships, ships, planes, spacecraft, science fiction, megastructures, the rides of the gods, the wonders of the Bible, the heavens — and, last, God. Sizes are real, so the world around the bubble keeps pulling back, from a meadow to the edge of the universe. A pile that stays above the strain line bursts the bubble and sends you back to the start of the era, every era brings a law of nature to understand, and at Normal a good player needs four to five hours to reach God. When God is born the bubble bursts, and God reads Genesis 1 while you touch each moment of creation into being. Physics, rules, the living world and the whole sound engine are Rust compiled to WebAssembly."
  he: "כל מסע מתחיל בתינוק זוחל בתוך בועת חיים שקופה. אתם מכוונים כל תא, ושני תאים זהים שנוגעים מתאחדים לדרגה הבאה, בסולם של 155 דרגות ב-19 עידנים — בעלי חיים לרכיבה, אופנועים, מכוניות, סופרקארים, מכונות כבדות, רכבות, ספינות מפרש, ספינות, מטוסים, חלליות, מדע בדיוני, מגה־מבנים, רכבי האלים, נפלאות התנ״ך והשמיים — ולבסוף אלוהים. הגדלים אמיתיים, אז העולם סביב הבועה מתרחק כל הזמן, מאחו ירוק ועד קצה היקום. ערימה שנשארת מעל קו הלחץ מפוצצת את הבועה ומחזירה לתחילת העידן, כל עידן מביא חוק טבע שצריך להבין, וברמה הרגילה שחקן טוב צריך ארבע עד חמש שעות כדי להגיע לאלוהים. כשאלוהים נוצר הבועה מתפוצצת, ואלוהים מקריא את פרק א׳ של בראשית בזמן שאתם בוראים בנגיעה כל רגע של הבריאה. הפיזיקה, החוקים, העולם החי ומנוע הסאונד כולו כתובים ב-Rust ומקומפלים ל-WebAssembly."

title: { en: "OH MY GOD", he: "OH MY GOD" }
subtitle: { en: "A merge game from crawling to the God of Israel — 155 tiers in a bubble of life, written in Rust.", he: "משחק מיזוג מזחילה עד אלוהי ישראל — 155 דרגות בבועת חיים, כתוב ב-Rust." }
summary:
  en: "Every run starts with a crawling baby in a see-through bubble of life. Two identical cells that touch fuse into the next tier, up a 155-step ladder in 19 eras — riding animals, motorbikes, cars, supercars, heavy machines, trains, sailing ships, ships, planes, spacecraft, science fiction, megastructures, the rides of the gods, the wonders of the Bible, the heavens — and, last, God. Sizes are real, so the world around the bubble keeps pulling back, from a meadow to the edge of the universe. When God is born the bubble bursts, and God reads Genesis 1 while you touch each moment of creation into being. Physics, rules, the living world and the whole sound engine are Rust compiled to WebAssembly."
  he: "כל סיבוב מתחיל בתינוק זוחל בתוך בועת חיים שקופה. שני תאים זהים שנוגעים מתמזגים לדרגה הבאה, בסולם של 155 דרגות ב-19 עידנים — בעלי חיים לרכיבה, אופנועים, מכוניות, סופרקארים, מכונות כבדות, רכבות, ספינות מפרש, ספינות, מטוסים, חלליות, מדע בדיוני, מגה־מבנים, רכבי האלים, נפלאות התנ״ך והשמיים — ולבסוף אלוהים. הגדלים אמיתיים, אז העולם סביב הבועה מתרחק כל הזמן, מאחו ירוק ועד קצה היקום. כשאלוהים נוצר הבועה מתפוצצת, ואלוהים מקריא את פרק א׳ של בראשית בזמן שאתם בוראים בנגיעה כל רגע של הבריאה. הפיזיקה, החוקים, העולם החי ומנוע הסאונד כולו כתובים ב-Rust ומקומפלים ל-WebAssembly."
category: { en: "Game · Rust + WebAssembly", he: "משחק · Rust + WebAssembly" }

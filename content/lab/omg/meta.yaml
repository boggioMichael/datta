builtLevels:
  built:
    en:
      - "Engine in Rust with no dependencies: bouncy ring-and-chute physics at 480 Hz with a sweep-and-prune broad phase, merge rules, chain reactions, random events, the 124-tier ladder, eight modes, six tools, saves and stats"
      - "Drama layer: slow-motion beats, camera punches, era title cards, speed lines, shockwaves, lightning, and a backdrop for every era — all built as draw commands in Rust"
      - "Sound engine in Rust, running in a Web Worker: 124 OMGs and their effects (bike bells, two-strokes, V-twins, train horns, ship horns, rotors, rockets, gongs, a shofar), a loop for every era and a bounce melody — every sound rendered live from 33 short voice clips"
      - "123 sticker-style illustrations drawn for the game, with no logos"
      - "Reel recorder: captures the game as a 9:16 video with its sound"
    he:
      - "מנוע ב-Rust בלי תלויות: פיזיקה קופצנית של טבעת ופיה ב-480 צעדים לשנייה עם sweep-and-prune, חוקי מיזוג, תגובות שרשרת, אירועים אקראיים, סולם של 124 דרגות, שמונה מצבים, שישה כלים, שמירה וסטטיסטיקה"
      - "שכבת דרמה: הילוך איטי, זום מצלמה, כרטיסי עידן, קווי מהירות, גלי הדף, ברקים ונוף לכל עידן — כולם נבנים כפקודות ציור ב-Rust"
      - "מנוע סאונד ב-Rust שרץ ב-Web Worker: ‏124 צעקות OMG והאפקטים שלהן (פעמון אופניים, דו־פעימתי, V-twin, צופר רכבת, צופר אונייה, רוטורים, טילים, גונג, שופר), לופ לכל עידן ומנגינת קפיצות — כל צליל מרונדר בזמן אמת מ-33 קטעי קול קצרים"
      - "‏123 איורים בסגנון מדבקה שצוירו במיוחד למשחק, בלי לוגואים"
      - "מקליט רילז: מקליט את המשחק כסרטון 9:16 עם הסאונד"

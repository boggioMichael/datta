title: { en: "The No Bank", he: "קופת הלא" }
subtitle: { en: "A piggy bank for every no you say to yourself, and a window onto other people's.", he: "קופה לכל לא שאומרים לעצמנו, וחלון לקופות של אחרים." }
summary:
  en: "A mental savings plan. Every time you say no to something you want but know is bad for you, you tap the pig and play money drops into its slot: a coin for a small no, a bill or a gold bar for a big one. Every plan is a pig of its own, with a goal that turns it gold and a daily report of every no. A bank can be shown to everyone, with its name or without it, and anyone can watch the banks others chose to show."
  he: "תוכנית חיסכון מנטלית. בכל פעם שאומרים לא למשהו שרוצים אבל יודעים שהוא רע לנו, מקישים על החזיר וכסף מדומה נופל לחריץ: מטבע ללא קטן, שטר או מטיל זהב ללא גדול. כל תוכנית היא חזיר משלה, עם יעד שמזהיב אותו ודוח יומי של כל הלא. אפשר להראות קופה לכולם, עם השם שלה או בלעדיו, וכל אחד יכול לצפות בקופות שאחרים בחרו להראות."
category: { en: "Tool · JavaScript + Node", he: "כלי · JavaScript ו-Node" }
status: live
started: "2026-11"

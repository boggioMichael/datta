title: { en: "Syrup Universal", he: "Syrup Universal" }
subtitle: { en: "Syrup learns the game with you.", he: "Syrup לומד את המשחק יחד איתך." }
summary:
  en: "An AI companion that watches whatever game you are playing, works out what is on the screen, learns the game and you, researches what it does not know, and coaches in short sentences. It only looks and talks."
  he: "מלווה בינה מלאכותית שצופה בכל משחק שאתם משחקים, מבין מה על המסך, לומד את המשחק ואתכם, חוקר מה שהוא לא יודע, ומאמן במשפטים קצרים. הוא רק מסתכל ומדבר."

opportunity:
  what: { en: "A single-flavour pistachio gelato good enough to sell on its own, and a small production method that can grow if people keep buying it.", he: "ג׳לאטו פיסטוק בטעם יחיד שטוב מספיק כדי להימכר בזכות עצמו, ושיטת ייצור קטנה שיכולה לגדול אם אנשים ימשיכו לקנות." }
  why: { en: "Pistachio is the flavour people pay the most for and are most often disappointed by. Doing one thing obsessively is a defensible position for a very small producer.", he: "פיסטוק הוא הטעם שאנשים משלמים עליו הכי הרבה ומתאכזבים ממנו הכי הרבה. לעשות דבר אחד באובססיביות היא עמדה שאפשר להגן עליה כיצרן קטן מאוד." }
  exists: { en: "Working formulations, a first sale, a costed plan, and a lab that runs every week.", he: "פורמולציות עובדות, מכירה ראשונה, תוכנית מתומחרת, ומעבדה שעובדת כל שבוע." }
  next: { en: "Equipment, then six months of measured iteration, then a packaging decision driven by what the batches say.", he: "ציוד, אחר כך שישה חודשים של איטרציה נמדדת, ואז החלטת אריזה לפי מה שהאצוות אומרות." }
  support: { en: "A small equipment investment now; later, a conversation about a first production line if demand is proven. Also useful: an introduction to a food technologist or a packaging designer.", he: "השקעת ציוד קטנה עכשיו; מאוחר יותר, שיחה על קו ייצור ראשון אם הביקוש יוכח. מועיל גם: היכרות עם טכנולוג/ית מזון או מעצב/ת אריזות." }

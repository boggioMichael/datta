subtitle: { en: "One-to-one lessons in programming and systems, with a practice app that includes full prep for the IDF technological screenings.", he: "שיעורים אחד על אחד בתכנות ובמערכות, עם אפליקציית תרגול שכוללת הכנה מלאה למיונים הטכנולוגיים." }
summary:
  en: "Michael's tutoring practice: Python and intro to programming, C/C++, Linux, Android, high-school computer science, a CTF (capture-the-flag) course, and preparation for the technological unit screenings (8200, Mamram) — over Zoom or in person, with a mobile practice app and a progress dashboard."
  he: "השיעורים הפרטיים של מיכאל: Python ומבוא לתכנות, C/C++, Linux, Android, מדעי המחשב לתיכון, קורס CTF והכנה למיוני היחידות הטכנולוגיות (8200, ממר״ם) — בזום או פרונטלי, עם אפליקציית תרגול לטלפון ולוח מעקב."

title: { en: "Ready for 8200", he: "מוכנים ל‑8200" }
subtitle: { en: "A Hebrew prep app for the IDF 8200 screening, with a human who watches your progress.", he: "אפליקציית הכנה בעברית למיוני 8200 — עם אדם שעוקב אחרי ההתקדמות." }
summary:
  en: "A mobile-first web app that drills the stages of the 8200 screening — psychotechnic, learning aptitude, intro to programming, personality, interviews, English — with surprise quizzes, progress tracking and a mentor dashboard. Free tier live; subscriptions opening."
  he: "אפליקציית ווב לטלפון שמתרגלת את שלבי המיון של 8200 — פסיכוטכני, יכולת למידה, מבוא לתכנות, אישיות, ראיונות, אנגלית — עם בוחני פתע, מעקב התקדמות ולוח ניהול למלווה. המסלול החינמי באוויר; המנויים נפתחים."
category: { en: "Education · product", he: "חינוך · מוצר" }
status: live
started: "2026-10"
updated: "2026-10-16"
featured: true
weight: 2
order: 2
accent: "#C8431F"
milestone:
  en: "Version 1 live at /8200 — free tier, question bank, generators, mentor dashboard; payments being wired"
  he: "גרסה 1 באוויר ב-/8200 — מסלול חינמי, מאגר שאלות, מחוללים, לוח ניהול; הסליקה בחיבור"
website: https://boggiomichael.github.io/datta/8200/
languages: ["Hebrew", "JavaScript"]
builtLevels:
  built:
    en:
      - "Six categories mapped to the screening stages, ~500 original questions with explanations, plus unlimited generated shape, series, arithmetic, attention and memory items"
      - "Registration, daily goal, streaks, surprise quizzes, timed simulations, progress per topic"
      - "Mentor dashboard: every student's accuracy per topic, personality profile, notes, plan activation, leads"
      - "Installable on the phone (PWA), works offline for the app shell"
    he:
      - "שש קטגוריות לפי שלבי המיון, כ-500 שאלות מקוריות עם הסברים, ועוד מחוללים ללא הגבלה: צורות, סדרות, חישוב, קשב וזיכרון"
      - "הרשמה, יעד יומי, רצפים, בוחני פתע, סימולציות עם שעון, התקדמות לפי נושא"
      - "לוח ניהול למלווה: דיוק של כל תלמיד/ה לפי נושא, פרופיל אישיות, הערות, הפעלת מנוי, פניות"
      - "ניתנת להתקנה על הטלפון (PWA), עובדת גם בלי רשת"
  prototyped:
    en:
      - "Live mode on Firebase (auth, database, push notifications) — one config file away"
      - "Subscription checkout through an Israeli payment page; receipts issued per sale"
    he:
      - "מצב חי על Firebase (הזדהות, מסד נתונים, התראות) — קובץ הגדרות אחד מההפעלה"
      - "רכישת מנוי דרך דף תשלום ישראלי; קבלה על כל מכירה"
  vision:
    en:
      - "Push-driven micro-drills that adapt to each student's weak spots"
      - "A second track for other technological units' screenings"
    he:
      - "מיקרו-אימונים בהתראות שמתאימים את עצמם לחולשות של כל תלמיד/ה"
      - "מסלול שני למיונים של יחידות טכנולוגיות נוספות"

title: { en: "MapleSyrup", he: "MapleSyrup" }
subtitle: { en: "Turns pixels from a running game into structured game state.", he: "הופך פיקסלים ממשחק רץ למצב משחק מובנה." }
summary:
  en: "A real-time perception engine that watches MapleStory through captured pixels alone — no memory reads, no injection — and produces confidence-scored game state. Rust, Windows, measured."
  he: "מנוע תפיסה בזמן אמת שצופה ב-MapleStory דרך פיקסלים בלבד — בלי קריאת זיכרון, בלי הזרקה — ומפיק מצב משחק עם ציוני ביטחון. Rust, Windows, נמדד."

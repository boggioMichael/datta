opportunity:
  what: { en: "A perception layer that turns any screen-rendered game into structured, confidence-scored state without touching the game's memory, code or input.", he: "שכבת תפיסה שהופכת כל משחק שמצויר על המסך למצב מובנה עם ציוני ביטחון, בלי לגעת בזיכרון, בקוד או בקלט של המשחק." }
  why: { en: "Companions, coaching, accessibility and analytics all need to know what is happening on screen, and most games expose no API for it. Reading pixels honestly — with “unknown” as a valid answer — is the part everyone skips.", he: "מלווים, אימון, נגישות ואנליטיקה — כולם צריכים לדעת מה קורה על המסך, ורוב המשחקים לא חושפים API לזה. לקרוא פיקסלים בכנות — עם ״לא ידוע״ כתשובה לגיטימית — זה החלק שכולם מדלגים עליו." }
  exists: { en: "An MVP that runs on real recordings at ~43 ms per frame, a published evidence trail, and a generic engine already extracted.", he: "MVP שרץ על הקלטות אמיתיות ב-~43 מילישניות לפריים, שובל ראיות מפורסם, ומנוע גנרי שכבר הופרד." }
  next: { en: "Make it game-agnostic (Syrup Universal), close the real-time budget on OCR, and put it in front of players.", he: "להפוך אותו לבלתי תלוי במשחק (Syrup Universal), לסגור את תקציב הזמן־אמת על OCR, ולשים אותו מול שחקנים." }
  support: { en: "Grant or research partnership first; players with a Windows machine who want to test; later, a conversation about pre-seed once the universal MVP works on a game it has never seen.", he: "מענק או שותפות מחקר קודם; שחקנים עם מחשב Windows שרוצים לבדוק; מאוחר יותר, שיחה על pre-seed ברגע שה-MVP האוניברסלי עובד על משחק שמעולם לא ראה." }

      - "הודעות וקביעת מפגש בנקודת אמצע ציבורית; הכתובת של אף אחד לא משותפת"
      - "ניהול, תור מודרציה, יומן ביקורת, חסימה, הסרת EXIF, מיקום גס"
      - "הפעלה בפקודה אחת עם PostgreSQL עצמאי; PWA למסך הבית של אייפון"

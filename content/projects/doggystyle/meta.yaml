funding:
  type: bootstrapped
  public: true
  stage: { en: "Working end-to-end local build; pre-pilot", he: "בנייה מקומית עובדת מקצה לקצה; לפני פיילוט" }
  exists: { en: "The full journey — photos in, profile out, ranked matches, mutual introduction, messaging, meetup — verified on every run of the smoke suite; a Hebrew business plan with scenarios, not forecasts", he: "המסע המלא — תמונות נכנסות, פרופיל יוצא, התאמות מדורגות, היכרות הדדית, הודעות, מפגש — מאומת בכל ריצה של סוויטת ה-smoke; תוכנית עסקית בעברית עם תרחישים, לא תחזיות" }
  next: { en: "A pilot in one city: production environment (TLS, backups, monitoring), per-module tests, real moderation, stronger age assurance, and a rename with trademark clearance", he: "פיילוט בעיר אחת: סביבת פרודקשן (TLS, גיבויים, ניטור), טסטים לכל מודול, מודרציה אמיתית, אימות גיל חזק יותר, ושינוי שם עם בדיקת סימן מסחר" }
  status: { en: "Bootstrapped. Source-available under BUSL-1.1, converting to Apache 2.0 in 2030.", he: "מימון עצמי. הקוד זמין תחת BUSL-1.1, עובר ל-Apache 2.0 ב-2030." }
  useOfFunds: { en: "Pilot infrastructure, moderation, legal clearance for the name, and the first local partnerships", he: "תשתית לפיילוט, מודרציה, בדיקה משפטית לשם, והשותפויות המקומיות הראשונות" }
opportunity:
  what: { en: "A dog-social product that fixes the three ways the category fails: profile creation is a chore, matching is appearance-first swiping, and coordination happens off-platform.", he: "מוצר חברתי לכלבים שמתקן את שלוש הדרכים שבהן הקטגוריה נכשלת: יצירת פרופיל היא מטלה, ההתאמה היא החלקה לפי מראה, והתיאום קורה מחוץ לפלטפורמה." }
  why: { en: "This is a density-and-trust business, not an algorithm business. The build already has the trust part — provenance on every attribute, mutual-consent introductions, no exact locations ever served — so the pilot can test density alone.", he: "זה עסק של צפיפות ואמון, לא עסק של אלגוריתם. בבנייה כבר יש את חלק האמון — מקור לכל תכונה, היכרויות בהסכמה הדדית, אף פעם לא מיקומים מדויקים — כך שהפיילוט יכול לבדוק צפיפות בלבד." }
  exists: { en: "A working local product with a recorded walkthrough, a documented threat model, ADRs for every significant decision, and a licence that keeps the commercial path exclusive until 2030.", he: "מוצר מקומי עובד עם הקלטה, מודל איומים מתועד, ADR לכל החלטה משמעותית, ורישיון ששומר את הנתיב המסחרי בלעדי עד 2030." }
  next: { en: "Decide the name, stand up production, and run a pilot in one neighbourhood with real owners.", he: "להחליט על השם, להקים פרודקשן, ולהריץ פיילוט בשכונה אחת עם בעלים אמיתיים." }
  support: { en: "A partner who knows the local pet market; a small amount of pilot capital; an introduction to a trademark attorney.", he: "שותף/ה שמכיר/ה את שוק חיות המחמד המקומי; הון קטן לפיילוט; היכרות עם עו״ד לסימני מסחר." }

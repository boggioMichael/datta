title: { en: "Doggystyle", he: "Doggystyle" }
subtitle: { en: "Tell us what you want for your dog. We do the rest.", he: "תגידו מה אתם רוצים בשביל הכלב. אנחנו עושים את השאר." }
summary:
  en: "A conversational service for dog owners: it builds your dog's profile from photos you already have, finds genuinely compatible dogs nearby, explains why, and helps arrange the meetup — all inside one chat box."
  he: "שירות שיחתי לבעלי כלבים: בונה את הפרופיל של הכלב מתמונות שכבר יש לכם, מוצא כלבים מתאימים באמת בסביבה, מסביר למה, ועוזר לקבוע את המפגש — הכול בתוך תיבת צ׳אט אחת."
category: { en: "Product · social · AI", he: "מוצר · חברתי · בינה מלאכותית" }
status: prototype
started: "2026-08"
updated: "2026-08-16"
featured: true
weight: 2
order: 4
accent: "#C98A4B"
milestone:
  en: "End-to-end journey works locally; a public pilot needs production infrastructure and a rename"
  he: "המסע המלא עובד מקומית; פיילוט ציבורי צריך תשתית פרודקשן ושינוי שם"
github: https://github.com/boggioMichael/doggystyle
languages: ["TypeScript", "React", "PostgreSQL"]
hero:
  src: "/images/doggystyle/01-landing.webp"
  alt: { en: "The Doggystyle landing screen: a single prompt box asking what you would like for your dog, with suggestions like find a walking buddy or arrange a playdate.", he: "מסך הנחיתה של Doggystyle: תיבת פרומפט אחת ששואלת מה תרצו בשביל הכלב, עם הצעות כמו למצוא חבר לטיול או לקבוע פלייידייט." }
  caption: { en: "The whole product is one prompt box. Everything else appears inside the conversation. Frame from the recorded walkthrough.", he: "כל המוצר הוא תיבת פרומפט אחת. כל השאר מופיע בתוך השיחה. פריים מתוך ההקלטה." }
gallery:
  - { src: "/images/doggystyle/02-profile.webp", alt: { en: "A generated dog profile: Max, Border Collie, 4 years, with provenance for each field and a prompt to confirm or correct.", he: "פרופיל כלב שנוצר אוטומטית: מקס, בורדר קולי, בן 4, עם מקור לכל שדה ואפשרות לאשר או לתקן." }, caption: { en: "The profile is proposed from photos; the owner confirms or corrects it by talking.", he: "הפרופיל מוצע מתוך תמונות; הבעלים מאשר או מתקן בדיבור." } }
  - { src: "/images/doggystyle/03-matches.webp", alt: { en: "Ranked matches with reasons: both high energy, both enjoy a good chase, within a couple of years in age.", he: "התאמות מדורגות עם סיבות: שניהם אנרגטיים, שניהם אוהבים מרדף, בטווח של כמה שנים בגיל." }, caption: { en: "Matching is deterministic; the model only phrases the reasons.", he: "ההתאמה דטרמיניסטית; המודל רק מנסח את הסיבות." } }
  - { src: "/images/doggystyle/04-provenance.webp", alt: { en: "A profile attribute table: each value with its source, confidence and whether the owner confirmed it; breeding information stays blank unless entered by the owner.", he: "טבלת תכונות פרופיל: כל ערך עם המקור, הביטחון והאם הבעלים אישר; מידע על הרבעה נשאר ריק אלא אם הבעלים הזין." }, caption: { en: "Every attribute carries provenance. Health, genetics and reproductive facts cannot be written by a model — a database constraint, not a convention.", he: "לכל תכונה יש מקור. עובדות על בריאות, גנטיקה ורבייה לא יכולות להיכתב על ידי מודל — אילוץ במסד הנתונים, לא מוסכמה." } }

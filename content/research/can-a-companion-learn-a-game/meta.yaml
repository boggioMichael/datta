title: { en: "Can an AI learn a game alongside the player?", he: "האם בינה מלאכותית יכולה ללמוד משחק לצד השחקן?" }
subtitle: { en: "The research direction behind MapleSyrup and Syrup Universal, stated as a question.", he: "כיוון המחקר שמאחורי MapleSyrup ו-Syrup Universal, מנוסח כשאלה." }
summary:

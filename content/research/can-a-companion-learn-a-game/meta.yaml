  he: "לא ״האם סוכן יכול לשחק משחק״ — זה נחקר היטב — אלא האם מלווה שרק צופה ומדבר יכול להפוך למומחה בכל מה שהשחקן משחק, בלי API, בלי אימון לכל משחק, ובלי לגעת בקלט אף פעם?"

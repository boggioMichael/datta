summary:
  en: "A perception pipeline that reads a game through pixels was documented as “real-time at 60 FPS”. Measuring it gave 11.6 FPS. This note records the numbers, the cause, and what the next measurement looked like."
  he: "צינור תפיסה שקורא משחק דרך פיקסלים תועד כ״זמן אמת ב-60 FPS״. מדידה נתנה 11.6 FPS. הרשומה הזאת מתעדת את המספרים, את הסיבה, ואיך נראתה המדידה הבאה."

  en: "A longer-form literary experiment about the rules a story conceals — definitions, first principles, and the characters invented to smuggle them in. Front matter and Chapter 42 published; the rest follows as it is finished."
  he: "ניסוי ספרותי ארוך יותר על הכללים שסיפור מסתיר — הגדרות, עקרונות ראשונים, והדמויות שהומצאו כדי להבריח אותם פנימה. החומר הפותח ופרק 42 פורסמו; השאר יבוא כשייגמר."

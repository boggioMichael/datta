note:
  en: "Work in progress, published in the order it gets finished rather than the order it will be read. Here: the introduction, the definitions and rules, the participants and initial conditions, and Chapter 42. The remaining chapters are drafts and stay in the drawer."
  he: "עבודה בתהליך, שמתפרסמת בסדר שבו היא נגמרת ולא בסדר שבו תיקרא. כאן: ההקדמה, ההגדרות והכללים, המשתתפים ותנאי ההתחלה, ופרק 42. שאר הפרקים טיוטות, ונשארים במגירה."

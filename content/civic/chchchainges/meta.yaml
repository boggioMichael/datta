title: { en: "Ch-ch-chain-ges", he: "Ch-ch-chain-ges" }
subtitle: { en: "A multiplayer phone game of human chains on the real streets of 55 Israeli cities.", he: "משחק רשת לטלפון: שרשראות אנושיות ברחובות האמיתיים של 55 ערים בישראל." }
summary:
  en: "An open-source browser game built for a political party's campaign: collect people, hold hands, grow a chain — on OpenStreetMap maps of real municipalities, with a single-player story mode, bots named after rival parties, and no registration, cookies or tracking."
  he: "משחק דפדפן בקוד פתוח שנבנה לקמפיין של מפלגה: אוספים אנשים, נותנים יד, מגדלים שרשרת — על מפות OpenStreetMap של רשויות אמיתיות, עם מצב סיפור לשחקן יחיד, בוטים על שם מפלגות יריבות, ובלי הרשמה, עוגיות או מעקב."
